name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04          # 钉死 24.04：ubuntu-latest 会在 11 月切到 26.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用第三方 setup-android action（已停维护，在新 runner 上会崩）。
      # runner 自带 ANDROID_HOME；没有就用官方 cmdline-tools 装一份。
      - name: Set up Android SDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL -o /tmp/cmd.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmd.zip -d /tmp
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "SDK 就绪：$ANDROID_HOME"

      - name: 准备 proot 二进制
        continue-on-error: true     # 下不到也不阻断，App 会提示手动补
        run: python3 tools/fetch-proot.py

      # 仓库里没有 gradle wrapper（jar 是二进制没法凭空生成），直接装 Gradle
      - name: 装 Gradle 8.2
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/g.zip -d /opt
          chmod +x /opt/gradle-8.2/bin/gradle
          echo "/opt/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: 编译 debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: QQBotContainer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
